[package]
name = "codejourney"
version = "0.1.0"
edition = "2021"

[dependencies]
git2 = "0.19"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
indicatif = "0.17"
toml = "0.8"
printpdf = "0.7"
