[package]
name = "codejourney"
version = "0.2.0"
edition = "2021"

[dependencies]
# CodeJourney only reads local repositories, so git2's networking features
# (https/ssh) are disabled — this drops the OpenSSL and libssh2 system
# dependencies and lets `cargo build --release` work without them installed.
git2 = { version = "0.19", default-features = false }
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
regex = "1"
indicatif = "0.17"
toml = "0.8"
printpdf = "0.7"
rusqlite = { version = "0.31", features = ["bundled"] }
